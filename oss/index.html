<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>localmd — an agent lives in your folder</title>
    <meta
      name="description"
      content="An agent lives in your folder, a wiki grows around your files. It reads the PDFs, EPUBs and notes already in the folder and writes linked Markdown beside them — every citation clicks back to the exact paragraph, and every change waits for your yes."
    />
    <!--
      Deliberately no canonical link, no og:/twitter: cards and no JSON-LD.
      All of those name a specific deployment — its address, its social image,
      its price, what its demo offers — and this file is served from wherever
      you put it. A build claiming to be somebody else's site is worse than one
      that says nothing, and search engines are entitled to a straight answer
      about which page they are looking at.

      If you deploy this, this is the file to add your own metadata to.
    -->
  </head>
  <body>
    <!-- Replaced at build time with the landing page's own sections, rendered
         from the same i18n catalogs the app renders from (see
         staticLandingCopy in vite.config.ts). Deliberately a marker and not a
         hand-written copy: a second version of the words is a fact in two
         places, and this is the one nobody would look at. The build fails if
         this element goes missing, so keep it even if you replace the metadata
         above. -->
    <noscript>
      <main>
        <h1>localmd — an agent lives in your folder</h1>
      </main>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
