<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Your localmd key</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #333;
        background: #fff;
      }
      main { max-width: 30rem; padding: 2rem 1.5rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; color: #111; }
      p { margin: 0 0 1rem; }
      .muted { color: #666; font-size: 0.875rem; }
      .key {
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
        background: #f4f4f5;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        padding: 0.6rem 0.7rem;
        margin: 0 0 1rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #2563eb;
        border: 0;
        border-radius: 6px;
        padding: 0.55rem 1.1rem;
        cursor: pointer;
      }
      button:disabled { background: #9ca3af; cursor: default; }
      a { color: #2563eb; }
      .ok { color: #15803d; }
      .warn { color: #b45309; }
      @media (prefers-color-scheme: dark) {
        body { color: #bbb; background: #1e1e1e; }
        h1 { color: #eee; }
        .muted { color: #888; }
        .key { background: #27272a; border-color: #3f3f46; }
        .ok { color: #4ade80; }
        .warn { color: #fbbf24; }
      }
    </style>
  </head>
  <body>
    <!--
      Where an early-access key is handed over.

      A static page, like the OAuth callback and for the same reason: it reads
      one string and writes one value, and booting the whole app bundle to do
      that would be the expensive way.

      THE KEY TRAVELS IN THE FRAGMENT, never the query string. Fragments are not
      sent to servers, so the key stays out of access logs, out of the Referer
      header, and out of any CDN in between. That is the entire reason for the
      `#` in the link the seller mails out.

      It does NOT verify the signature. Verification needs the public key and
      belongs in one place — the app, which does it on every load and can say
      the four different things that can be wrong. This page only reads the
      payload to show what is about to be installed, and installs it. A forged
      key that gets this far simply fails in the app, which is where it should.
    -->
    <main>
      <h1 id="title">Your localmd key</h1>
      <div id="body"></div>
    </main>
    <script>
      ;(function () {
        // Must match STORAGE_KEY in src/stores/settings.ts — a drift test in
        // src/lib/claimPage.test.ts fails the build if these two disagree.
        var STORAGE_KEY = 'localmd:settings'
        var APP_URL = '/'
        var title = document.getElementById('title')
        var body = document.getElementById('body')

        function esc(s) {
          return String(s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
          })
        }

        function fromBase64url(s) {
          var b64 = s.replace(/-/g, '+').replace(/_/g, '/')
          return atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4))
        }

        /** Shape only. Returns the payload object, or null. */
        function readKey(key) {
          var parts = key.split('.')
          if (parts.length !== 3 || parts[0] !== 'LMD1') return null
          try {
            var json = JSON.parse(decodeURIComponent(escape(fromBase64url(parts[1]))))
            return json && typeof json === 'object' ? json : null
          } catch (e) {
            return null
          }
        }

        function say(html) {
          body.innerHTML = html
        }

        var key = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim()

        if (!key) {
          title.textContent = 'Nothing to claim'
          say(
            '<p>This page installs a licence key, and the link you followed did not carry one.</p>' +
              '<p class="muted">If you copied the link by hand, make sure you took all of it — everything after the <code>#</code> is the key.</p>',
          )
          return
        }

        var payload = readKey(key)
        if (!payload) {
          title.textContent = "That does not look like a key"
          say(
            '<p>The link carried something, but it is not shaped like a localmd key. The most likely cause is a truncated copy — a key is one long unbroken line.</p>' +
              '<p class="muted">Try the link from the original message again, or paste the key straight into <strong>Settings → Licence</strong>.</p>',
          )
          return
        }

        var kind = payload.kind === 'early' ? 'early-access key' : 'licence key'
        // Named on purpose: the name is inside the signed key, so showing it is
        // both a receipt ("this one is mine") and the reason not to share it.
        var who = payload.to ? ', issued to <strong>' + esc(payload.to) + '</strong>' : ''
        var until = payload.expires
          ? ' It works until <strong>' + esc(payload.expires) + '</strong>.'
          : ' It does not expire.'

        say(
          '<p>This is an ' + kind + ' for localmd' + who + '.' + until + '</p>' +
            '<div class="key">' + esc(key) + '</div>' +
            '<p><button id="install">Install it in this browser</button></p>' +
            '<p class="muted">It is stored in this browser only, next to your other settings. ' +
            'Nothing is sent anywhere, and there is no account. Keep this link if you use more than one browser.</p>',
        )

        document.getElementById('install').addEventListener('click', function () {
          var settings
          try {
            var raw = localStorage.getItem(STORAGE_KEY)
            settings = raw ? JSON.parse(raw) : {}
          } catch (e) {
            // Refuse rather than overwrite. Unparseable settings still hold this
            // person's API keys; replacing the blob wholesale to save them one
            // paste would be a terrible trade.
            say(
              '<p class="warn">Your existing localmd settings could not be read, so nothing was changed — overwriting them could lose your API keys.</p>' +
                '<p>Open the app and paste the key into <strong>Settings → Licence</strong> instead:</p>' +
                '<div class="key">' + esc(key) + '</div>',
            )
            return
          }
          if (!settings || typeof settings !== 'object') settings = {}
          settings.licenceKey = key
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(settings))
          } catch (e) {
            say(
              '<p class="warn">This browser would not let the key be saved (' + esc(e.message) + ').</p>' +
                '<p>Paste it into <strong>Settings → Licence</strong> instead:</p>' +
                '<div class="key">' + esc(key) + '</div>',
            )
            return
          }
          title.textContent = 'Installed'
          say(
            '<p class="ok">The key is in this browser.</p>' +
              '<p>Open localmd and it will already be active — <strong>Settings → Licence</strong> shows how long it runs for.</p>' +
              '<p><a href="' + APP_URL + '">Open localmd</a></p>',
          )
        })
      })()
    </script>
  </body>
</html>
