<!doctype html><html><head><meta charset="utf-8"><style>
/* The link preview card — what a shared localmd URL looks like in a feed,
   a chat, or a Product Hunt comment. Rendered by shoot-og.mjs into
   public/og.png at 1200x630, the size the og:image meta tags declare.

   The words are the message house's one-liner, both sentences, verbatim. An
   earlier version of this image said "your notes, PDFs, and chats live in a
   local folder — no account, no upload", which reads fine and is not the
   sentence every other surface uses. A one-liner only compounds if it is
   byte-identical everywhere, and this image is the copy most people see
   before they see any of the others.

   Ink, matching the landing page it links to: someone who clicks this card
   should arrive somewhere that looks like the card. It was light until
   2026-08-28, back when the landing followed the app's light theme; the
   landing now commits to ink, and a white card in front of a black page reads
   as two different products. */
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1200px; height:630px; overflow:hidden; }
body {
  background:
    radial-gradient(42% 46% at 66% 34%, rgba(96,174,255,.13), transparent 70%),
    radial-gradient(34% 34% at 26% 76%, rgba(74,222,128,.07), transparent 70%),
    linear-gradient(160deg,#070a0d 0%,#0a0e13 55%,#070a0d 100%);
  color:#edf2f6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0 84px; text-align:center;
}
.mark { display:flex; align-items:center; gap:22px; margin-bottom:44px; }
.mark svg { width:96px; height:96px; display:block; }
.word { font-size:76px; font-weight:700; letter-spacing:-.02em; line-height:1; }
.word .br { color:#3d4a57; }
.word .b { color:#edf2f6; }
.word .i { color:#60aeff; }
h1 { font-size:40px; line-height:1.28; font-weight:700; letter-spacing:-.015em; max-width:980px; }
.sub { margin-top:22px; font-size:29px; line-height:1.4; color:#909ba4; max-width:940px; }
.foot { margin-top:54px; font-size:21px; color:#6a757e; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.foot b { font-weight:400; color:#6a757e; }
</style></head>
<body>
<div class="mark">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <rect width="128" height="128" rx="28" fill="#58a6ff"/>
    <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 36H36v56h14"/>
      <path d="M78 36h14v56H78"/>
    </g>
    <circle cx="64" cy="64" r="6.5" fill="#fff"/>
  </svg>
  <div class="word"><span class="br">[[</span><span class="b">local</span><span class="i">md</span><span class="br">]]</span></div>
</div>
<h1>An agent lives in your folder,<br>a wiki grows around your files.</h1>
<div class="sub">It reads the PDFs, EPUBs and notes already in the folder and writes linked Markdown beside them.</div>
<div class="foot">No install&nbsp; ·&nbsp; No account&nbsp; ·&nbsp; No upload&nbsp; ·&nbsp; No usage caps</div>
</body></html>
